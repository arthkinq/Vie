name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build client
        working-directory: client
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: |
          npm ci
          npm run build
      - name: Deploy to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          tar -czf /tmp/client-dist.tar.gz -C client/dist .
          tar -czf /tmp/server.tar.gz -C server package.json package-lock.json src data

          scp -O /tmp/client-dist.tar.gz /tmp/server.tar.gz "$SSH_USER@$SSH_HOST:/tmp/"

          ssh "$SSH_USER@$SSH_HOST" "
            tar -xzf /tmp/client-dist.tar.gz -C /var/www/react-app/dist/ && rm /tmp/client-dist.tar.gz
            tar -xzf /tmp/server.tar.gz -C /opt/app-backend/ && rm /tmp/server.tar.gz
            cd /opt/app-backend && npm ci --omit=dev && sudo systemctl restart app-backend
          "
